<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Orbital Satellite Tracker</title>


<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<style>

* {
    box-sizing: border-box;
}


html,
body {
    margin: 0;
    padding: 0;

    background: #07111f;
    color: #eef6ff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {
    padding: 16px;

    background: #0a192b;

    border-bottom:
        1px solid #29435e;
}


.title {
    font-size: 23px;
    font-weight: 800;
}


.subtitle {
    margin-top: 5px;

    color: #8db8dd;

    font-size: 13px;
}



/* =========================================================
   SEARCH
   ========================================================= */

.search-area {
    display: flex;

    gap: 8px;

    margin-top: 14px;
}


#searchInput {
    flex: 1;

    min-width: 0;

    padding: 12px;

    border:
        1px solid #45647f;

    border-radius: 10px;

    background: white;

    color: #111;

    font-size: 17px;
}


#searchButton {
    width: 68px;

    border: 0;

    border-radius: 10px;

    background: #2278e5;

    color: white;

    font-size: 22px;

    font-weight: bold;

    cursor: pointer;
}


#searchButton:disabled {
    opacity: 0.5;

    cursor: wait;
}


#searchStatus {
    min-height: 21px;

    margin-top: 9px;

    color: #89d7ff;

    font-size: 14px;

    font-weight: 600;
}


.error {
    color: #ff7474 !important;
}



/* =========================================================
   SATELLITE INFO
   ========================================================= */

.info-card {
    margin: 12px;

    padding: 14px;

    background: #0d2035;

    border:
        1px solid #284b68;

    border-radius: 14px;
}


#satName {
    margin-bottom: 10px;

    font-size: 21px;

    font-weight: 800;
}


.info-grid {
    display: grid;

    grid-template-columns:
        105px 1fr;

    gap: 6px 8px;

    font-size: 14px;
}


.label {
    color: #91b7d5;
}


.value {
    font-weight: 600;

    word-break: break-word;
}



/* =========================================================
   ASCENDING / DESCENDING
   ========================================================= */

#direction {
    display: none;

    margin-top: 12px;

    padding: 6px 11px;

    border-radius: 16px;

    font-size: 14px;

    font-weight: 800;
}


.ascending {
    background: #155fa0;
}


.descending {
    background: #a84e0b;
}



/* =========================================================
   MAP
   ========================================================= */

#map {
    height: 58vh;

    min-height: 430px;

    margin:
        0 12px;

    border:
        1px solid #335c7b;

    border-radius: 14px;

    overflow: hidden;
}



/* =========================================================
   TIMELINE
   ========================================================= */

.timeline {
    margin: 12px;

    padding: 14px;

    background: #0d2035;

    border:
        1px solid #284b68;

    border-radius: 14px;
}


.timeline-title {
    color: #91b7d5;

    font-size: 14px;
}


#sliderTime {
    margin:
        8px 0 10px;

    text-align: center;

    font-size: 18px;

    font-weight: 800;
}


#timeSlider {
    width: 100%;
}


.slider-labels {
    display: flex;

    justify-content: space-between;

    margin-top: 4px;

    color: #789ab5;

    font-size: 12px;
}


.track-legend {
    display: flex;

    justify-content: center;

    gap: 22px;

    margin-top: 12px;

    font-size: 13px;

    font-weight: 700;
}


.asc-color {
    color: #4aa3ff;
}


.desc-color {
    color: #ff9b42;
}



/* =========================================================
   BUTTONS
   ========================================================= */

.timeline-buttons {
    display: flex;

    justify-content: center;

    margin-top: 12px;
}


#nowButton {
    border: 0;

    border-radius: 9px;

    padding:
        9px 18px;

    background: #1f6fc5;

    color: white;

    font-weight: 700;

    cursor: pointer;
}



/* =========================================================
   MOBILE
   ========================================================= */

@media (
    max-width: 600px
) {

    .title {
        font-size: 20px;
    }


    #map {
        height: 62vh;

        min-height: 430px;
    }


    .info-grid {
        grid-template-columns:
            96px 1fr;
    }

}

</style>

</head>



<body>


<!-- =======================================================
     HEADER
     ======================================================= -->

<div class="header">


    <div class="title">

        🛰 ORBITAL SATELLITE TRACKER

    </div>


    <div class="subtitle">

        NORAD ID / 衛星名から現在位置と軌道を表示

    </div>


    <div class="search-area">


        <input
            id="searchInput"
            type="text"
            placeholder="例：25544 / ISS"
            autocomplete="off"
        >


        <button
            id="searchButton"
            type="button"
        >

            🔍

        </button>


    </div>


    <div id="searchStatus">

        NORAD ID または衛星名を入力

    </div>


</div>



<!-- =======================================================
     INFO
     ======================================================= -->

<div class="info-card">


    <div id="satName">

        衛星を検索してください

    </div>


    <div class="info-grid">


        <div class="label">
            NORAD
        </div>

        <div
            class="value"
            id="norad"
        >
            -
        </div>



        <div class="label">
            表示時刻
        </div>

        <div
            class="value"
            id="infoTime"
        >
            -
        </div>



        <div class="label">
            緯度
        </div>

        <div
            class="value"
            id="latitude"
        >
            -
        </div>



        <div class="label">
            経度
        </div>

        <div
            class="value"
            id="longitude"
        >
            -
        </div>



        <div class="label">
            高度
        </div>

        <div
            class="value"
            id="altitude"
        >
            -
        </div>



        <div class="label">
            Epoch
        </div>

        <div
            class="value"
            id="epoch"
        >
            -
        </div>


    </div>


    <div id="direction">
    </div>


</div>



<!-- =======================================================
     MAP
     ======================================================= -->

<div id="map">
</div>



<!-- =======================================================
     TIMELINE
     ======================================================= -->

<div class="timeline">


    <div class="timeline-title">

        ⏱ 時刻をスライド

    </div>


    <div id="sliderTime">

        現在

    </div>


    <input
        id="timeSlider"
        type="range"
        min="-60"
        max="180"
        value="0"
        step="1"
        disabled
    >


    <div class="slider-labels">

        <span>
            -60分
        </span>

        <span>
            現在
        </span>

        <span>
            +180分
        </span>

    </div>


    <div class="track-legend">


        <span class="asc-color">

            ● 上りパス

        </span>


        <span class="desc-color">

            ● 下りパス

        </span>


    </div>


    <div class="timeline-buttons">


        <button
            id="nowButton"
            type="button"
            disabled
        >

            ⏱ 現在時刻へ戻る

        </button>


    </div>


</div>



<script type="module">


import * as satellite
from "https://cdn.jsdelivr.net/npm/satellite.js@7.0.1/+esm";



/* =========================================================
   CLOUDFLARE WORKER
   ========================================================= */

const WORKER =

    "https://orbital-satellite-proxy.shingo48691014.workers.dev/orbit";



/* =========================================================
   MAP
   ========================================================= */

const map =

    L.map(
        "map",
        {
            worldCopyJump:
                true
        }
    )

    .setView(
        [
            20,
            135
        ],
        2
    );



L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom:
            8,

        attribution:
            "OpenStreetMap"

    }

).addTo(
    map
);



/* =========================================================
   STATE
   ========================================================= */

let currentSatrec =
    null;


let currentOmm =
    null;


let baseTime =
    null;


let satelliteMarker =
    null;


let trackLines =
    [];



/* =========================================================
   DOM
   ========================================================= */

const searchInput =

    document.getElementById(
        "searchInput"
    );


const searchButton =

    document.getElementById(
        "searchButton"
    );


const searchStatus =

    document.getElementById(
        "searchStatus"
    );


const slider =

    document.getElementById(
        "timeSlider"
    );


const nowButton =

    document.getElementById(
        "nowButton"
    );



/* =========================================================
   JST FORMAT
   ========================================================= */

function formatJST(
    date
) {

    return new Intl.DateTimeFormat(

        "ja-JP",

        {

            timeZone:
                "Asia/Tokyo",

            year:
                "numeric",

            month:
                "2-digit",

            day:
                "2-digit",

            hour:
                "2-digit",

            minute:
                "2-digit",

            second:
                "2-digit",

            hour12:
                false

        }

    ).format(
        date
    )
    +
    " JST";

}



/* =========================================================
   POSITION
   ========================================================= */

function positionAt(
    date
) {


    if (
        !currentSatrec
    ) {

        return null;
    }


    const result =

        satellite.propagate(

            currentSatrec,

            date

        );


    if (
        !result ||
        !result.position
    ) {

        return null;
    }


    const gmst =

        satellite.gstime(
            date
        );


    const geodetic =

        satellite.eciToGeodetic(

            result.position,

            gmst

        );


    return {

        lat:

            satellite.degreesLat(
                geodetic.latitude
            ),


        lon:

            satellite.degreesLong(
                geodetic.longitude
            ),


        alt:

            geodetic.height

    };

}



/* =========================================================
   ASCENDING / DESCENDING
   ========================================================= */

function directionAt(
    date
) {


    const before =

        positionAt(

            new Date(

                date.getTime()
                -
                10000

            )

        );


    const after =

        positionAt(

            new Date(

                date.getTime()
                +
                10000

            )

        );


    if (
        !before ||
        !after
    ) {

        return null;
    }


    if (
        after.lat >
        before.lat
    ) {

        return "ascending";
    }


    return "descending";

}



/* =========================================================
   UPDATE MARKER
   ========================================================= */

function updateMarker(
    date
) {


    const position =

        positionAt(
            date
        );


    if (
        !position
    ) {

        searchStatus.classList.add(
            "error"
        );


        searchStatus.textContent =

            "❌ 軌道計算に失敗しました";


        return;
    }


    const direction =

        directionAt(
            date
        );


    const markerColor =

        direction ===
        "ascending"

            ? "#278cff"

            : "#ff8a22";



    /* -----------------------------------------------------
       CREATE MARKER
       ----------------------------------------------------- */

    if (
        !satelliteMarker
    ) {


        satelliteMarker =

            L.circleMarker(

                [

                    position.lat,

                    position.lon

                ],

                {

                    radius:
                        10,

                    color:
                        "#ffffff",

                    weight:
                        2,

                    fillColor:
                        markerColor,

                    fillOpacity:
                        1

                }

            )

            .addTo(
                map
            );

    }


    else {


        satelliteMarker.setLatLng(

            [

                position.lat,

                position.lon

            ]

        );


        satelliteMarker.setStyle(

            {

                fillColor:
                    markerColor

            }

        );

    }



    /* -----------------------------------------------------
       POPUP
       ----------------------------------------------------- */

    satelliteMarker.bindPopup(

        "<b>"
        +
        (
            currentOmm?.OBJECT_NAME
            ||
            "SATELLITE"
        )
        +
        "</b><br>"
        +
        "NORAD："
        +
        (
            currentOmm?.NORAD_CAT_ID
            ??
            "-"
        )
        +
        "<br>"
        +
        "緯度："
        +
        position.lat.toFixed(4)
        +
        "°<br>"
        +
        "経度："
        +
        position.lon.toFixed(4)
        +
        "°<br>"
        +
        "高度："
        +
        position.alt.toFixed(1)
        +
        " km<br>"
        +
        (
            direction ===
            "ascending"

                ? "🔵 上りパス"

                : "🟠 下りパス"
        )

    );



    /* -----------------------------------------------------
       INFO
       ----------------------------------------------------- */

    document
        .getElementById(
            "infoTime"
        )
        .textContent =

            formatJST(
                date
            );


    document
        .getElementById(
            "latitude"
        )
        .textContent =

            position.lat.toFixed(
                4
            )
            +
            "°";


    document
        .getElementById(
            "longitude"
        )
        .textContent =

            position.lon.toFixed(
                4
            )
            +
            "°";


    document
        .getElementById(
            "altitude"
        )
        .textContent =

            position.alt.toFixed(
                1
            )
            +
            " km";



    /* -----------------------------------------------------
       DIRECTION
       ----------------------------------------------------- */

    const directionBox =

        document.getElementById(
            "direction"
        );


    directionBox.style.display =

        "inline-block";


    if (
        direction ===
        "ascending"
    ) {


        directionBox.className =

            "ascending";


        directionBox.textContent =

            "🔵 上りパス";

    }


    else {


        directionBox.className =

            "descending";


        directionBox.textContent =

            "🟠 下りパス";

    }

}



/* =========================================================
   CLEAR TRACK
   ========================================================= */

function clearTrack() {


    trackLines.forEach(

        function(
            line
        ) {

            map.removeLayer(
                line
            );

        }

    );


    trackLines =
        [];

}



/* =========================================================
   DRAW TRACK

   -60分 ～ +180分
   2分間隔
   ========================================================= */

function drawTrack() {


    clearTrack();


    if (
        !currentSatrec ||
        !baseTime
    ) {

        return;
    }


    let previous =
        null;



    for (

        let minute = -60;

        minute <= 180;

        minute += 2

    ) {


        const date =

            new Date(

                baseTime.getTime()
                +
                minute
                *
                60000

            );


        const position =

            positionAt(
                date
            );


        if (
            !position
        ) {


            previous =
                null;


            continue;
        }


        const direction =

            directionAt(
                date
            );



        if (
            previous
        ) {


            const lonDifference =

                Math.abs(

                    position.lon
                    -
                    previous.lon

                );



            /*
             * 日付変更線を跨いだ時に
             * 世界地図を横断する線を描かない
             */
            if (
                lonDifference <
                180
            ) {


                const line =

                    L.polyline(

                        [

                            [

                                previous.lat,

                                previous.lon

                            ],


                            [

                                position.lat,

                                position.lon

                            ]

                        ],

                        {

                            color:

                                direction ===
                                "ascending"

                                    ? "#278cff"

                                    : "#ff8a22",


                            weight:
                                3,


                            opacity:
                                0.85

                        }

                    )

                    .addTo(
                        map
                    );


                trackLines.push(
                    line
                );

            }

        }


        previous =

            position;

    }

}



/* =========================================================
   NORMALIZE NAME
   ========================================================= */

function normalizeName(
    value
) {


    return String(
        value || ""
    )

    .toUpperCase()

    .replace(

        /[^A-Z0-9]/g,

        ""

    );

}



/* =========================================================
   SEARCH
   ========================================================= */

async function searchSatellite() {


    const query =

        searchInput
            .value
            .trim();


    if (
        !query
    ) {


        searchStatus.textContent =

            "衛星名かNORAD IDを入力してください";


        return;
    }



    searchStatus.classList.remove(
        "error"
    );


    searchStatus.textContent =

        "🔄 衛星データを取得中…";


    searchButton.disabled =

        true;



    try {


        /* -------------------------------------------------
           NORADか衛星名か判定
           1～9桁NORAD対応
           ------------------------------------------------- */

        const numeric =

            /^[0-9]{1,9}$/.test(
                query
            );



        /* -------------------------------------------------
           Worker URL
           ------------------------------------------------- */

        const url =

            numeric

                ? WORKER
                    +
                    "?catnr="
                    +
                    encodeURIComponent(
                        query
                    )

                : WORKER
                    +
                    "?name="
                    +
                    encodeURIComponent(
                        query
                    );



        /* -------------------------------------------------
           Workerへ問い合わせ
           ------------------------------------------------- */

        const response =

            await fetch(

                url,

                {

                    cache:
                        "no-store"

                }

            );



        if (
            !response.ok
        ) {


            throw new Error(

                "HTTP "
                +
                response.status

            );

        }



        const data =

            await response.json();



        if (
            !Array.isArray(
                data
            )
            ||
            data.length ===
            0
        ) {


            throw new Error(

                "該当衛星なし"

            );

        }



        /* -------------------------------------------------
           NAME検索で複数候補なら
           完全一致を優先
           ------------------------------------------------- */

        let omm =

            data[0];



        if (
            !numeric
        ) {


            const queryNormalized =

                normalizeName(
                    query
                );


            const exact =

                data.find(

                    function(
                        item
                    ) {


                        return (

                            normalizeName(
                                item.OBJECT_NAME
                            )

                            ===

                            queryNormalized

                        );

                    }

                );


            if (
                exact
            ) {


                omm =

                    exact;

            }

        }



        /* -------------------------------------------------
           OMM → SGP4
           ------------------------------------------------- */

        currentOmm =

            omm;


        currentSatrec =

            satellite.json2satrec(
                omm
            );



        if (
            !currentSatrec
        ) {


            throw new Error(

                "OMM変換失敗"

            );

        }



        /* -------------------------------------------------
           現在時刻を基準にする
           ------------------------------------------------- */

        baseTime =

            new Date();



        slider.value =

            "0";


        slider.disabled =

            false;


        nowButton.disabled =

            false;



        /* -------------------------------------------------
           INFO
           ------------------------------------------------- */

        document
            .getElementById(
                "satName"
            )
            .textContent =

                omm.OBJECT_NAME
                ||
                "UNKNOWN";


        document
            .getElementById(
                "norad"
            )
            .textContent =

                String(

                    omm.NORAD_CAT_ID
                    ??
                    "-"

                );


        document
            .getElementById(
                "epoch"
            )
            .textContent =

                omm.EPOCH
                ||
                "-";



        /* -------------------------------------------------
           TRACK
           ------------------------------------------------- */

        drawTrack();



        /* -------------------------------------------------
           CURRENT POSITION
           ------------------------------------------------- */

        updateMarker(
            baseTime
        );



        const currentPosition =

            positionAt(
                baseTime
            );



        if (
            currentPosition
        ) {


            map.setView(

                [

                    currentPosition.lat,

                    currentPosition.lon

                ],

                4,

                {

                    animate:
                        true

                }

            );

        }



        document
            .getElementById(
                "sliderTime"
            )
            .textContent =

                "現在";



        /* -------------------------------------------------
           STATUS
           ------------------------------------------------- */

        if (
            data.length >
            1
        ) {


            searchStatus.textContent =

                "✅ "
                +
                omm.OBJECT_NAME
                +
                " / NORAD "
                +
                omm.NORAD_CAT_ID
                +
                "（候補 "
                +
                data.length
                +
                "件）";

        }


        else {


            searchStatus.textContent =

                "✅ "
                +
                omm.OBJECT_NAME
                +
                " / NORAD "
                +
                omm.NORAD_CAT_ID;

        }

    }


    catch (
        error
    ) {


        console.error(
            error
        );


        searchStatus.classList.add(
            "error"
        );


        searchStatus.textContent =

            "❌ 衛星データを取得できませんでした";

    }


    finally {


        searchButton.disabled =

            false;

    }

}



/* =========================================================
   TIME SLIDER
   ========================================================= */

slider.addEventListener(

    "input",

    function() {


        if (
            !baseTime
        ) {

            return;
        }


        const minutes =

            Number(
                slider.value
            );


        const date =

            new Date(

                baseTime.getTime()
                +
                minutes
                *
                60000

            );



        if (
            minutes ===
            0
        ) {


            document
                .getElementById(
                    "sliderTime"
                )
                .textContent =

                    "現在";

        }


        else if (
            minutes >
            0
        ) {


            document
                .getElementById(
                    "sliderTime"
                )
                .textContent =

                    "+"
                    +
                    minutes
                    +
                    "分";

        }


        else {


            document
                .getElementById(
                    "sliderTime"
                )
                .textContent =

                    minutes
                    +
                    "分";

        }



        updateMarker(
            date
        );

    }

);



/* =========================================================
   NOW BUTTON
   ========================================================= */

nowButton.addEventListener(

    "click",

    function() {


        if (
            !currentSatrec
        ) {

            return;
        }



        baseTime =

            new Date();


        slider.value =

            "0";


        document
            .getElementById(
                "sliderTime"
            )
            .textContent =

                "現在";



        drawTrack();



        updateMarker(
            baseTime
        );



        const position =

            positionAt(
                baseTime
            );


        if (
            position
        ) {


            map.setView(

                [

                    position.lat,

                    position.lon

                ],

                4,

                {

                    animate:
                        true

                }

            );

        }

    }

);



/* =========================================================
   SEARCH BUTTON
   ========================================================= */

searchButton.addEventListener(

    "click",

    searchSatellite

);



/* =========================================================
   ENTER SEARCH
   ========================================================= */

searchInput.addEventListener(

    "keydown",

    function(
        event
    ) {


        if (
            event.key ===
            "Enter"
        ) {


            event.preventDefault();


            searchSatellite();

        }

    }

);



/* =========================================================
   INITIAL VALUE
   ========================================================= */

searchInput.value =

    "25544";


</script>


</body>

</html>
