<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Satellite Control</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #07111f;
    color: #eef6ff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =========================================
   HEADER
   ========================================= */

header {
    padding: 24px 14px 18px;

    text-align: center;

    background: #091626;

    border-bottom:
        1px solid #1b3450;
}


h1 {
    margin: 0;

    font-size: 28px;
}


.subtitle {
    margin-top: 7px;

    color: #87a4c2;

    font-size: 13px;
}


/* =========================================
   MAIN
   ========================================= */

.container {
    width:
        min(
            1200px,
            calc(100% - 20px)
        );

    margin:
        18px auto;
}


/* =========================================
   SATELLITE SELECT
   ========================================= */

.sat-grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;
}


.sat-card {
    padding:
        15px 10px;

    background: #0d1d30;

    border:
        1px solid #284561;

    border-radius: 14px;

    cursor: pointer;

    transition:
        0.15s;
}


.sat-card:active {
    transform:
        scale(0.98);
}


.sat-card.active {
    background: #102742;

    border:
        2px solid #2384ff;
}


.sat-name {
    font-size: 18px;

    font-weight: 800;
}


.sat-update {
    margin-top: 7px;

    color: #8fa9c3;

    font-size: 12px;

    word-break:
        break-word;
}


/* =========================================
   CONTROL
   ========================================= */

.control {
    margin:
        16px 0;

    padding: 16px;

    text-align: center;

    background: #0d1d30;

    border:
        1px solid #284561;

    border-radius: 14px;
}


#selectedTitle {
    margin-bottom: 12px;

    font-size: 21px;

    font-weight: 800;
}


#updateBtn {
    width:
        min(
            430px,
            100%
        );

    padding:
        14px 20px;

    border: 0;

    border-radius: 11px;

    background: #1677ff;

    color: white;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;
}


#updateBtn:disabled {
    opacity: 0.5;
}


#status {
    min-height: 24px;

    margin-top: 10px;

    color: #73d7ff;

    font-size: 14px;
}


/* =========================================
   MAP
   ========================================= */

.map-wrap {
    overflow: hidden;

    background: white;

    border:
        1px solid #284561;

    border-radius: 14px;
}


iframe {
    display: block;

    width: 100%;

    height: 72vh;

    min-height: 570px;

    border: 0;
}


/* =========================================
   LINKS
   ========================================= */

.links {
    margin:
        14px 0 25px;

    text-align: center;
}


.links a {
    display: inline-block;

    margin:
        5px 9px;

    color: #73b9ff;

    text-decoration: none;
}


/* =========================================
   MOBILE
   ========================================= */

@media (
    max-width: 700px
) {

    .sat-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }


    h1 {
        font-size: 23px;
    }


    .sat-name {
        font-size: 16px;
    }


    iframe {
        height: 72vh;

        min-height: 560px;
    }

}

</style>

</head>


<body>


<header>

    <h1>
        🛰 SATELLITE CONTROL
    </h1>

    <div class="subtitle">
        GEO Satellite Monitor + Orbital Satellite Tracker
    </div>

</header>



<div class="container">


    <!-- =====================================
         SELECT CARDS
         ===================================== -->

    <div class="sat-grid">


        <div
            class="sat-card active"
            id="card-tjs"
            onclick="selectSystem('tjs')"
        >

            <div class="sat-name">
                🛰 TJS
            </div>

            <div class="sat-update">

                最終更新：

                <span id="time-tjs">
                    読込中...
                </span>

            </div>

        </div>



        <div
            class="sat-card"
            id="card-russia"
            onclick="selectSystem('russia')"
        >

            <div class="sat-name">
                🇷🇺 Russia
            </div>

            <div class="sat-update">

                最終更新：

                <span id="time-russia">
                    読込中...
                </span>

            </div>

        </div>



        <div
            class="sat-card"
            id="card-china"
            onclick="selectSystem('china')"
        >

            <div class="sat-name">
                🇨🇳 China
            </div>

            <div class="sat-update">

                最終更新：

                <span id="time-china">
                    読込中...
                </span>

            </div>

        </div>



        <div
            class="sat-card"
            id="card-orbital"
            onclick="selectSystem('orbital')"
        >

            <div class="sat-name">
                🌍 ORBITAL
            </div>

            <div class="sat-update">
                NORAD / 衛星名から検索
            </div>

        </div>


    </div>



    <!-- =====================================
         CONTROL AREA
         ===================================== -->

    <div class="control">


        <div id="selectedTitle">
            TJS GEO
        </div>


        <button
            id="updateBtn"
            onclick="updateSelected()"
        >

            🔄 選択中の衛星データを更新

        </button>


        <div id="status">
        </div>


    </div>



    <!-- =====================================
         MAP FRAME
         ===================================== -->

    <div class="map-wrap">

        <iframe
            id="mapFrame"
            src="/tjs_geo_control/tjs_map.html"
        >
        </iframe>

    </div>



    <!-- =====================================
         LINKS
         ===================================== -->

    <div class="links">


        <a
            id="controlLink"
            href="/tjs_geo_control/"
            target="_blank"
        >

            個別画面を開く

        </a>


        <a
            id="csvLink"
            href="/tjs_geo_control/tjs_geo.csv"
            target="_blank"
        >

            CSV

        </a>


    </div>


</div>



<script>


/* =========================================
   UPDATE WORKER
   ========================================= */

const UPDATE_WORKER =

    "https://satellite-map-updater.shingo48691014.workers.dev";



/* =========================================
   SYSTEM SETTINGS
   ========================================= */

const systems = {


    tjs: {

        title:
            "TJS GEO",

        map:
            "/tjs_geo_control/tjs_map.html",

        control:
            "/tjs_geo_control/",

        csv:
            "/tjs_geo_control/tjs_geo.csv",

        updated:
            "/tjs_geo_control/last_updated.txt",

        worker:
            "/tjs",

        orbital:
            false

    },


    russia: {

        title:
            "Russia GEO",

        map:
            "/russia_geo_map/russia_map.html",

        control:
            "/russia_geo_map/",

        csv:
            "/russia_geo_map/russia_geo.csv",

        updated:
            "/russia_geo_map/last_updated.txt",

        worker:
            "/russia",

        orbital:
            false

    },


    china: {

        title:
            "China GEO",

        map:
            "/china_geo_map/china_map.html",

        control:
            "/china_geo_map/",

        csv:
            "/china_geo_map/china_geo.csv",

        updated:
            "/china_geo_map/last_updated.txt",

        worker:
            "/china",

        orbital:
            false

    },


    orbital: {

        title:
            "ORBITAL SATELLITE TRACKER",

        map:
            "/orbital_satellite_map/",

        control:
            "/orbital_satellite_map/",

        csv:
            null,

        updated:
            null,

        worker:
            null,

        orbital:
            true

    }

};



/* =========================================
   CURRENT SYSTEM
   ========================================= */

let selected =
    "tjs";



/* =========================================
   SELECT SYSTEM
   ========================================= */

function selectSystem(
    name
) {


    selected =
        name;


    document
        .querySelectorAll(
            ".sat-card"
        )
        .forEach(
            function(card) {

                card
                    .classList
                    .remove(
                        "active"
                    );

            }
        );


    document
        .getElementById(
            "card-" + name
        )
        .classList
        .add(
            "active"
        );


    const system =
        systems[name];


    document
        .getElementById(
            "selectedTitle"
        )
        .textContent =
            system.title;


    const frame =
        document
            .getElementById(
                "mapFrame"
            );


    frame.src =
        system.map
        +
        "?t="
        +
        Date.now();



    const button =
        document
            .getElementById(
                "updateBtn"
            );


    const csv =
        document
            .getElementById(
                "csvLink"
            );


    const control =
        document
            .getElementById(
                "controlLink"
            );


    const status =
        document
            .getElementById(
                "status"
            );


    control.href =
        system.control;



    /* =====================================
       ORBITAL
       ===================================== */

    if (
        system.orbital
    ) {


        button.style.display =
            "none";


        csv.style.display =
            "none";


        control.textContent =
            "周回衛星画面を大きく開く";


        status.textContent =
            "🌍 NORAD ID または衛星名を検索してください";


        /*
         * ORBITALだけコンパクト表示
         *
         * 以前：
         * 1100px / 900px
         *
         * 今回：
         * 700px / 650px
         */

        frame.style.height =
            "700px";


        frame.style.minHeight =
            "650px";

    }


    /* =====================================
       GEO
       ===================================== */

    else {


        button.style.display =
            "inline-block";


        button.disabled =
            false;


        csv.style.display =
            "inline-block";


        csv.href =
            system.csv;


        control.textContent =
            "個別画面を開く";


        status.textContent =
            "";


        /*
         * ORBITALで設定した固定値を解除
         * CSSの通常サイズへ戻す
         */

        frame.style.height =
            "";


        frame.style.minHeight =
            "";

    }

}



/* =========================================
   LAST UPDATED
   ========================================= */

async function getLastUpdated(
    name
) {


    const system =
        systems[name];


    if (
        !system.updated
    ) {

        return "";

    }


    try {


        const response =
            await fetch(

                system.updated
                +
                "?t="
                +
                Date.now(),

                {

                    cache:
                        "no-store"

                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP "
                +
                response.status
            );

        }


        const text =
            (
                await response.text()
            )
            .trim();


        document
            .getElementById(
                "time-" + name
            )
            .textContent =
                text;


        return text;

    }


    catch (
        error
    ) {


        console.error(
            error
        );


        document
            .getElementById(
                "time-" + name
            )
            .textContent =
                "取得失敗";


        return "";

    }

}



/* =========================================
   REFRESH ALL UPDATE TIMES
   ========================================= */

async function refreshTimes() {


    await Promise.all(

        [

            getLastUpdated(
                "tjs"
            ),

            getLastUpdated(
                "russia"
            ),

            getLastUpdated(
                "china"
            )

        ]

    );

}



/* =========================================
   UPDATE SELECTED GEO MAP
   ========================================= */

async function updateSelected() {


    const system =
        systems[selected];


    if (
        system.orbital
        ||
        !system.worker
    ) {

        return;

    }


    const button =
        document
            .getElementById(
                "updateBtn"
            );


    const status =
        document
            .getElementById(
                "status"
            );


    button.disabled =
        true;



    const before =
        await getLastUpdated(
            selected
        );


    status.textContent =
        "🔄 更新要求を送信しています...";


    try {


        const response =
            await fetch(

                UPDATE_WORKER
                +
                system.worker,

                {

                    method:
                        "POST"

                }

            );


        const result =
            await response.json();



        if (
            !response.ok
            ||
            !result.ok
        ) {

            throw new Error(
                "Worker update failed"
            );

        }



        status.textContent =
            "⏳ GitHub Actionsで更新中...";


        let checks =
            0;



        const timer =
            setInterval(

                async function() {


                    checks++;



                    const current =
                        await getLastUpdated(
                            selected
                        );



                    if (
                        current
                        &&
                        before
                        &&
                        current !== before
                    ) {


                        clearInterval(
                            timer
                        );


                        status.textContent =
                            "✅ 更新完了！";


                        document
                            .getElementById(
                                "mapFrame"
                            )
                            .src =
                                system.map
                                +
                                "?t="
                                +
                                Date.now();


                        button.disabled =
                            false;


                        refreshTimes();


                        return;

                    }



                    if (
                        checks >=
                        30
                    ) {


                        clearInterval(
                            timer
                        );


                        status.textContent =
                            "⚠ 更新処理は継続中です。少し後で確認してください。";


                        button.disabled =
                            false;

                    }

                },

                5000

            );

    }


    catch (
        error
    ) {


        console.error(
            error
        );


        status.textContent =
            "❌ 更新要求に失敗しました";


        button.disabled =
            false;

    }

}



/* =========================================
   INITIAL LOAD
   ========================================= */

refreshTimes();


</script>


</body>
</html>
